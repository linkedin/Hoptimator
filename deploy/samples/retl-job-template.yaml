apiVersion: hoptimator.linkedin.com/v1alpha1
kind: JobTemplate
metadata:
  name: retl-job-template
  namespace: default
spec:
  databases: ["ads-catalog-database"]
  yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: {{name}}-job
    spec:
      template:
        spec:
          containers:
          - name: hello
            image: alpine/k8s:1.33.0
            env:
              - name: TABLE_TRIGGER_NAME
                value: "{{trigger}}"
              - name: SOURCE_TABLE_NAME
                value: "{{path}}"
              - name: ONLINE_TABLE_NAME
                value: "{{job.properties.online.table.name}}"
              # Fire window [WINDOW_START, WINDOW_END]. On an incremental fire this is
              # [watermark, timestamp]; on a backfill (FIRE ... FROM ... TO ...) it is [FROM, TO].
              - name: WINDOW_START
                value: "{{watermark}}"
              - name: WINDOW_END
                value: "{{timestamp}}"
              - name: WINDOW_START_DATE
                value: "{{watermarkDate}}"
              - name: WINDOW_END_DATE
                value: "{{timestampDate}}"
            command: ["bash",  "-c", "echo {{name}}-trigger processing window [$WINDOW_START, $WINDOW_END] at `date`"]
          restartPolicy: Never
      backoffLimit: 4