services:
  zookeeper:
    image: venicedb/apache-zookeeper:3.9.0
    container_name: zookeeper
    hostname: zookeeper
    healthcheck:
        test: ["CMD-SHELL", "echo ruok | nc zookeeper 2181"]
        start_period: 10s
        interval: 5s
        timeout: 5s
        retries: 5

  kafka:
    image: venicedb/apache-kafka:3.3.1
    container_name: kafka
    hostname: kafka
    environment:
      - ZOOKEEPER_ADDRESS=zookeeper:2181
    ports:
      - 9095:9092
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
        test: ["CMD-SHELL", "bash -x bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
        start_period: 60s
        interval: 5s
        timeout: 20s
        retries: 5

  venice-controller:
    image: venicedb/venice-controller:0.4.858
    container_name: venice-controller
    hostname: venice-controller
    # Local-only override: disable Venice's default 6h store-recreation cooldown
    # (controller.store.recreation.after.deletion.time.window.seconds, default 21600) so
    # integration tests that create and delete Venice stores are re-runnable without waiting.
    # Appends the override to the image's baked-in controller.properties, then launches normally.
    command:
      - sh
      - -c
      - echo "controller.store.recreation.after.deletion.time.window.seconds=0" >> configs/single-dc/controller.properties && java -jar bin/venice-controller-all.jar configs/single-dc/cluster.properties configs/single-dc/controller.properties
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - 5555:5555
    healthcheck:
        test: ["CMD-SHELL", "sleep 5"]
        start_period: 20s
        interval: 5s
        timeout: 20s
        retries: 5

  venice-server:
    image: venicedb/venice-server:0.4.858
    container_name: venice-server
    hostname: venice-server
    depends_on:
      venice-controller:
        condition: service_healthy
    healthcheck:
        test: ["CMD-SHELL", "sleep 5"]
        start_period: 20s
        interval: 5s
        timeout: 20s
        retries: 5

  venice-router:
    image: venicedb/venice-router:0.4.858
    container_name: venice-router
    hostname: venice-router
    depends_on:
      venice-server:
        condition: service_healthy
    ports:
      - 7777:7777
    healthcheck:
        test: ["CMD-SHELL", "sleep 5"]
        start_period: 20s
        interval: 5s
        timeout: 20s
        retries: 5

  venice-client:
    image: venicedb/venice-client:0.4.858
    container_name: venice-client
    hostname: venice-client
    tty: true
    volumes:
      - ./schemas:/opt/venice/schemas
    depends_on:
      venice-router:
        condition: service_healthy
